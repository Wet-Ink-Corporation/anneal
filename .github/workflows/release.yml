name: release
# A tag v<version> (matching plugin.json and Cargo.toml, on main, with a CHANGELOG section)
# runs CI, builds the binaries per target, and publishes the GitHub release with them,
# a zip of the plugin with every build in libexec/, and SHA256SUMS.
# Marketplace publishing and packaging polish land with #44.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: versions agree with the tag, which is on main and has a changelog entry
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" plugin/.claude-plugin/plugin.json
          grep -q "^version = \"$v\"" Cargo.toml
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $GITHUB_REF_NAME is not on main; merge first, then tag" >&2; exit 1; }
          scripts/changelog-section.sh "$v" >/dev/null

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [versions, test]
    strategy:
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, target: x86_64-unknown-linux-musl, bin: anneal }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, target: aarch64-unknown-linux-musl, bin: anneal }
          - { os: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin, bin: anneal }
          - { os: blacksmith-4vcpu-windows-2025, target: x86_64-pc-windows-msvc, bin: anneal.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }} -p anneal-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-*-*"
          path: plugin/libexec
      - name: package and checksum
        run: |
          v="${GITHUB_REF_NAME#v}"
          chmod +x plugin/libexec/*/anneal 2>/dev/null || true
          cp plugin/libexec/x86_64-pc-windows-msvc/anneal.exe plugin/libexec/anneal.exe
          mkdir assets
          for d in plugin/libexec/*/; do
            t=$(basename "$d")
            for f in "$d"anneal "$d"anneal.exe; do
              [ -f "$f" ] || continue
              case "$f" in *.exe) cp "$f" "assets/anneal-$t.exe" ;; *) cp "$f" "assets/anneal-$t" ;; esac
            done
          done
          (cd plugin && zip -qr "../assets/anneal-plugin-$v.zip" .)
          (cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          scripts/changelog-section.sh "$v" > notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" assets/* --title "anneal $GITHUB_REF_NAME" \
              --notes-file notes.md --prerelease=${{ startsWith(github.ref_name, 'v0.0.') }} \
              --repo "$GITHUB_REPOSITORY"
          fi

  marketplace:
    # Refreshes the `marketplace` branch: the tag's tree plus the release binaries.
    # Install with: /plugin marketplace add Wet-Ink-Corporation/anneal#marketplace
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-*-*"
          path: plugin/libexec
      - name: commit the tag's tree with binaries to the marketplace branch
        run: |
          chmod +x plugin/libexec/*/anneal
          cp plugin/libexec/x86_64-pc-windows-msvc/anneal.exe plugin/libexec/anneal.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan marketplace
          git add -A
          git add -f plugin/libexec
          git commit -q -m "marketplace: ${GITHUB_REF_NAME} ($(git rev-parse --short "$GITHUB_SHA"))"
          git push --force origin marketplace
